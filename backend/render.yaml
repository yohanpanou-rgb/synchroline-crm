# Render blueprint for the medi360 backend + the optional weekly report cron job.
# NOTE: Render cron schedules run in UTC. "0 14 * * 6" = Saturday 17:00 in Athens
# during EEST (summer, UTC+3). In winter (EET, UTC+2) this becomes 16:00 local —
# adjust the cron expression twice a year, or move to a UTC-aware scheduler if that's
# not acceptable.
services:
  - type: web
    name: medi360-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: medi360
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: medi360
      - key: REPORTS_CRON_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: cron
    name: medi360-weekly-report-cron
    env: docker
    schedule: "0 14 * * 6" # Saturday 17:00 Athens time (EEST, UTC+3) — see note above
    dockerCommand: >
      curl -fsS -X POST
      "$BACKEND_URL/api/reports/send?to=$WEEKLY_REPORT_RECIPIENTS"
      -H "X-Cron-Secret: $REPORTS_CRON_SECRET"
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: WEEKLY_REPORT_RECIPIENTS
        sync: false
      - key: REPORTS_CRON_SECRET
        sync: false
